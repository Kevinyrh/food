<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>🍴 美食探索</title>
<style>
:root{--pri:#FF6B35;--pri-l:#FF8C5A;--pri-d:#E55A2B;--pri-bg:#FFF3ED;--bg:#F8F6F3;--card:#FFF;--bd:#EBE8E3;--txt:#2D2D2D;--txt2:#8E8B87;--txt3:#B8B5B1;--gn:#4CAF50;--pk:#E91E63;--star:#FFB800;--r:16px;--r-sm:8px;--sh-sm:0 1px 3px rgba(0,0,0,.06);--sh:0 2px 12px rgba(0,0,0,.08);--sh-lg:0 8px 30px rgba(0,0,0,.12);--safe:env(safe-area-inset-bottom,0px);--bnav:56px;--tf:.15s ease;--t:.3s ease;--ts:.5s cubic-bezier(.4,0,.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#EDEBE8;color:var(--txt);line-height:1.5;min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:600px;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden;display:flex;flex-direction:column}
.page{flex:1;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--bnav)+var(--safe)+90px)}
.page.active{display:flex}

/* ═══ 顶部栏 v8: 左侧定位+右侧距离 ═══ */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);flex-shrink:0;position:sticky;top:0;z-index:15}
.top-loc{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--txt);cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;font-family:inherit;max-width:60%;overflow:hidden}
.top-loc .loc-icon{font-size:1rem;flex-shrink:0}
.top-loc .loc-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.top-dist{display:flex;align-items:center;gap:3px;font-size:.78rem;font-weight:500;color:var(--pri);background:var(--pri-bg);border:1.5px solid var(--pri);border-radius:18px;padding:6px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;flex-shrink:0}
.top-dist:active{transform:scale(.95)}
.top-dist .arr{font-size:.45rem;opacity:.6}

/* ═══ 分类 Tab 栏 v8 ═══ */
.cat-tabs{display:flex;gap:6px;padding:10px 12px 6px;background:var(--card);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:.8rem;font-weight:500;border:1.5px solid var(--bd);background:var(--bg);color:var(--txt2);cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;white-space:nowrap;transition:all var(--tf)}
.cat-tab:active{transform:scale(.95)}
.cat-tab.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600;box-shadow:0 2px 8px rgba(255,107,53,.3)}

/* ═══ 细类胶囊栏 v8 ═══ */
.sub-row{display:none;gap:6px;padding:4px 12px 10px;background:var(--card);flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--bd)}
.sub-row::-webkit-scrollbar{display:none}
.sub-row.on{display:flex}
.sub-chip{flex-shrink:0;padding:5px 12px;border-radius:14px;font-size:.73rem;font-weight:500;border:1px solid var(--bd);background:var(--bg);color:var(--txt2);cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;white-space:nowrap;transition:all var(--tf)}
.sub-chip:active{transform:scale(.95)}
.sub-chip.on{background:var(--pri-bg);color:var(--pri);border-color:var(--pri)}

.res-count{font-size:.72rem;color:var(--txt3);padding:4px 14px 0}
.res-list{flex:1;padding:8px 14px;display:flex;flex-direction:column;gap:8px}

/* 随机按钮 */
.rand-fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:20;padding:13px 34px;font-size:.95rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri-d));border:none;border-radius:26px;cursor:pointer;box-shadow:0 4px 20px rgba(255,107,53,.4);transition:all var(--tf);-webkit-tap-highlight-color:transparent;font-family:inherit}.rand-fab:active{transform:translateX(-50%) scale(.94)}.rand-fab:disabled{background:#ccc;box-shadow:none}.rand-fab.hide{opacity:0;pointer-events:none}

.res-card{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh-sm);cursor:pointer;position:relative;overflow:hidden;transition:all var(--tf);display:flex;gap:12px;align-items:center;-webkit-tap-highlight-color:transparent;user-select:none}.res-card:active{transform:scale(.98);box-shadow:var(--sh)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,107,53,.2);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}@keyframes rip{to{transform:scale(4);opacity:0}}
.card-pic{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.8rem;overflow:hidden}.card-pic img{width:100%;height:100%;border-radius:12px;object-fit:cover}
.card-info{flex:1;min-width:0}.card-name{font-size:.92rem;font-weight:600;color:var(--txt);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:2px}
.tag{font-size:.65rem;padding:2px 6px;border-radius:6px;font-weight:500;white-space:nowrap}.tag-s{background:#E8F5E9;color:var(--gn)}.tag-f{background:#FCE4EC;color:var(--pk)}.tag-c{background:#FFF8E1;color:#E65100}
.card-meta{display:flex;align-items:center;gap:7px;font-size:.7rem;color:var(--txt2)}.card-dist{font-weight:500;color:var(--pri)}.card-price{color:var(--txt3)}.card-addr{font-size:.65rem;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card-more{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;background:transparent;font-size:1rem;cursor:pointer;color:var(--txt3);z-index:2;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}.card-more:active{background:var(--bg);color:var(--txt)}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;color:var(--txt2)}.e-emoji{font-size:3.5rem;margin-bottom:16px}.e-title{font-size:1rem;font-weight:600;color:var(--txt);margin-bottom:6px}.e-desc{font-size:.85rem;color:var(--txt3)}
.placeholder-page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;color:var(--txt2)}.placeholder-icon{font-size:4rem;margin-bottom:16px}.placeholder-title{font-size:1.1rem;font-weight:600;color:var(--txt);margin-bottom:8px}.placeholder-desc{font-size:.85rem;color:var(--txt3)}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:flex;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--bd);padding-bottom:var(--safe);z-index:30}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0 4px;border:none;background:none;cursor:pointer;color:var(--txt3);transition:color var(--tf);-webkit-tap-highlight-color:transparent;font-family:inherit;gap:1px}.nav-tab .nav-icon{font-size:1.4rem}.nav-tab .nav-label{font-size:.62rem;font-weight:500}.nav-tab.active{color:var(--pri)}

.pop-menu{position:fixed;background:var(--card);border-radius:var(--r-sm);box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:60;opacity:0;pointer-events:none;transform:scale(.9);transition:all .2s ease;min-width:140px;overflow:hidden}.pop-menu.on{opacity:1;pointer-events:auto;transform:scale(1)}
.pop-item{display:block;width:100%;padding:12px 16px;border:none;background:none;font-size:.9rem;color:var(--txt);cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;font-family:inherit}.pop-item:active{background:var(--bg)}.pop-item.danger{color:#E53935}

.slot-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity var(--t)}.slot-overlay.on{opacity:1;pointer-events:auto}
.slot-machine{background:linear-gradient(180deg,#3a2a1a,#5a3a2a 30%,#4a2a1a 70%,#2a1a0a);border-radius:var(--r);padding:20px 16px 16px;box-shadow:0 12px 48px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:12px;border:3px solid #8B6914}
.slot-reels{display:flex;gap:10px;background:#1a0a00;border-radius:12px;padding:10px;border:2px solid #8B6914}
.slot-reel{width:85px;height:130px;background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0)25%,rgba(0,0,0,0)75%,rgba(0,0,0,.6));border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(139,105,20,.4);position:relative}
.slot-reel::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,215,0,.4);z-index:2;pointer-events:none;transform:translateY(-50%)}
.reel-emoji{font-size:2.5rem;line-height:1}.reel-name{font-size:.7rem;color:#fff;font-weight:600;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8);max-width:80px;overflow:hidden;text-overflow:ellipsis}
.slot-reel.win{animation:reel-win .5s ease 3}@keyframes reel-win{0%,100%{box-shadow:0 0 0 rgba(255,215,0,0)}50%{box-shadow:0 0 24px rgba(255,215,0,.7),inset 0 0 16px rgba(255,215,0,.3)}}
.slot-hint{color:#FFD700;font-size:.85rem;font-weight:600;text-shadow:0 0 10px rgba(255,215,0,.5)}
.slot-close{margin-top:4px;padding:8px 20px;border-radius:20px;border:1.5px solid rgba(255,255,255,.4);background:transparent;color:rgba(255,255,255,.7);font-size:.8rem;cursor:pointer;font-family:inherit}

.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--t)}.sheet-ov.on{opacity:1;pointer-events:auto}
.sheet-pn{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:600px;max-height:80vh;max-height:80dvh;background:var(--card);border-radius:var(--r) var(--r) 0 0;padding:24px 20px;padding-bottom:calc(24px+var(--safe));z-index:91;overflow-y:auto;transition:transform var(--ts);box-shadow:0 -4px 20px rgba(0,0,0,.15)}.sheet-pn.on{transform:translateX(-50%) translateY(0)}
.sheet-hdl{width:40px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}.sheet-emoji{font-size:3.5rem;text-align:center;margin-bottom:8px}.sheet-name{font-size:1.3rem;font-weight:700;text-align:center;margin-bottom:8px}.sheet-tags{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.sheet-row{display:flex;justify-content:space-around;text-align:center;padding:12px 0;border-top:1px solid var(--bd);margin-bottom:16px}.sheet-item{display:flex;flex-direction:column;gap:2px}.sheet-val{font-size:1.1rem;font-weight:600}.sheet-lbl{font-size:.75rem;color:var(--txt3)}.sheet-addr{font-size:.85rem;color:var(--txt2);text-align:center;margin-bottom:16px}.sheet-acts{display:flex;gap:10px}
.s-btn{flex:1;padding:12px 16px;border-radius:var(--r);font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--tf);-webkit-tap-highlight-color:transparent;font-family:inherit;border:none;text-align:center}.s-btn:active{transform:scale(.95)}
.s-btn-pri{background:var(--pri);color:#fff;box-shadow:0 2px 8px rgba(255,107,53,.3)}.s-btn-sec{background:var(--bg);color:var(--txt);border:1.5px solid var(--bd)}.s-btn-out{background:transparent;color:var(--txt2);border:1.5px solid var(--bd);font-weight:400;width:100%;margin-top:8px}

.srch-page{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s ease}.srch-page.on{opacity:1;pointer-events:auto}
.srch-top{display:flex;align-items:center;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top,0px));background:var(--card);gap:8px;flex-shrink:0}
.srch-back{width:36px;height:36px;border:none;background:none;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pri);flex-shrink:0}
.srch-wrap{flex:1;display:flex;align-items:center;background:var(--bg);border-radius:10px;padding:0 10px;gap:6px}.srch-icon{font-size:1rem;opacity:.5}
.srch-inp{flex:1;border:none;background:none;padding:10px 0;font-size:.95rem;outline:none;font-family:inherit;color:var(--txt)}.srch-inp::placeholder{color:var(--txt3)}
.srch-clr{width:22px;height:22px;border-radius:50%;border:none;background:#ccc;color:#fff;font-size:.7rem;cursor:pointer;flex-shrink:0;display:none;align-items:center;justify-content:center}.srch-clr.on{display:flex}
.srch-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0}
.srch-item{display:flex;align-items:center;padding:13px 16px;gap:10px;cursor:pointer;background:var(--card);border-bottom:.5px solid var(--bd)}.srch-item:active{background:var(--bg)}
.srch-item-icon{font-size:1.1rem;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:8px;flex-shrink:0}.srch-item-info{flex:1;min-width:0}.srch-item-name{font-size:.92rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srch-item-addr{font-size:.76rem;color:var(--txt3);margin-top:1px}.srch-item-dist{font-size:.7rem;color:var(--pri);flex-shrink:0;font-weight:500}
.srch-empty,.srch-loading{text-align:center;padding:40px 16px;color:var(--txt3);font-size:.85rem}

.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:95;opacity:0;pointer-events:none;transition:opacity var(--t);padding:20px}.modal-ov.on{opacity:1;pointer-events:auto}
.modal-pn{width:100%;max-width:360px;max-height:70vh;max-height:70dvh;background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-title{font-size:1.1rem;font-weight:700}.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.bl-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:var(--r-sm)}.bl-emoji{font-size:1.4rem}.bl-name{flex:1;font-size:.9rem;font-weight:500}
.btn-restore{padding:6px 14px;border-radius:14px;border:none;background:var(--pri-bg);color:var(--pri);font-size:.8rem;font-weight:500;cursor:pointer;font-family:inherit}.btn-restore:active{transform:scale(.9)}.modal-empty{text-align:center;padding:32px 16px;color:var(--txt3);font-size:.9rem}

.toast-ct{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 20px;background:rgba(45,45,45,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:22px;font-size:.85rem;font-weight:500;white-space:nowrap;animation:tin .3s ease forwards,tout .3s ease 1.8s forwards;pointer-events:auto;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@keyframes tout{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}
.bl-link-wrap{display:flex;justify-content:center;padding:4px 0 0}.bl-link{background:none;border:none;font-size:.82rem;color:var(--txt2);cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:inherit;padding:6px 12px}.bl-link.has{color:var(--pri);font-weight:500}
/* 距离popover */
.dist-pop{position:fixed;background:var(--card);border-radius:12px;box-shadow:0 6px 28px rgba(0,0,0,.18);z-index:70;opacity:0;pointer-events:none;transform:translateY(-4px);transition:all .2s ease;padding:4px 0;min-width:100px}.dist-pop.on{opacity:1;pointer-events:auto;transform:translateY(0)}
.dist-pop .it{display:block;width:100%;padding:11px 20px;border:none;background:none;font-size:.85rem;color:var(--txt);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;font-family:inherit}.dist-pop .it:active{background:var(--bg)}.dist-pop .it.sel{color:var(--pri);font-weight:600;background:var(--pri-bg)}
.dist-back{position:fixed;inset:0;z-index:69;display:none}.dist-back.on{display:block}
</style>
</head>
<body>
<div class="app">
<div class="page active" id="page-home">
  <!-- ═══ 顶部栏 v8 ═══ -->
  <header class="top-bar">
    <button class="top-loc" id="topLoc"><span class="loc-icon">📍</span><span class="loc-txt" id="locTxt">定位中...</span></button>
    <button class="top-dist" id="topDist">500m<span class="arr">▼</span></button>
  </header>
  <div class="dist-back" id="distBack"></div>
  <div class="dist-pop" id="distPop"></div>

  <!-- ═══ 分类 Tab v8 ═══ -->
  <div class="cat-tabs" id="catTabs">
    <button class="cat-tab on" data-v="全部美食">全部</button>
    <button class="cat-tab" data-v="简餐">🍜 简餐</button>
    <button class="cat-tab" data-v="正餐">🥩 正餐</button>
    <button class="cat-tab" data-v="饮品">🥤 饮品</button>
    <button class="cat-tab" data-v="小吃">🍿 小吃</button>
  </div>
  <div class="sub-row" id="subRow"></div>

  <div class="res-count" id="resCount"></div>
  <div class="res-list" id="resList"></div>
  <div class="bl-link-wrap"><button class="bl-link" id="btnBl">📋 查看黑名单</button></div>
</div>
<div class="page" id="page-translate"><div class="placeholder-page"><div class="placeholder-icon">📖</div><div class="placeholder-title">菜谱翻译</div><div class="placeholder-desc">功能开发中，敬请期待 ✨</div></div></div>
<div class="page" id="page-profile"><div class="placeholder-page"><div class="placeholder-icon">👤</div><div class="placeholder-title">个人中心</div><div class="placeholder-desc">功能开发中，敬请期待 ✨</div></div></div>

<button class="rand-fab" id="btnRand">🎰 随机摇一家</button>

<div class="srch-page" id="srchPage"><div class="srch-top"><button class="srch-back" id="srchBack">←</button><div class="srch-wrap"><span class="srch-icon">🔍</span><input class="srch-inp" id="srchInp" placeholder="搜索地址" autocomplete="off"><button class="srch-clr" id="srchClr">✕</button></div></div><div class="srch-body" id="srchBody"><div class="srch-empty">输入关键词搜索地址</div></div></div>

<div class="slot-overlay" id="slotOv"><div class="slot-machine"><div class="slot-reels"><div class="slot-reel" id="slotR1"><span class="reel-emoji" id="reelE1">🎰</span><span class="reel-name" id="reelN1">准备</span></div><div class="slot-reel" id="slotR2"><span class="reel-emoji" id="reelE2">🎰</span><span class="reel-name" id="reelN2">准备</span></div><div class="slot-reel" id="slotR3"><span class="reel-emoji" id="reelE3">🎰</span><span class="reel-name" id="reelN3">准备</span></div></div><p class="slot-hint" id="slotHint">🎰 随机抽取中...</p></div><button class="slot-close" id="slotClose">关闭</button></div>

/* ── 从 BRAND_DICT 查找品牌（模糊匹配） ── */
function matchBrand(name){
  for(var k in BRAND_DICT){if(!BRAND_DICT.hasOwnProperty(k))continue;
    if(name===k)return BRAND_DICT[k];                         // 精确匹配
    if(name.indexOf(k)>=0&&k.length>=2)return BRAND_DICT[k];  // name包含key（key≥2字）
    if(k.indexOf(name)>=0&&name.length>=4)return BRAND_DICT[k]; // key包含name（name≥4字）
  }
  return null;
}

/* ═══ JSONP + API（自动分页） ═══ */
function jp(path,params){return new Promise(function(rs,rj){var cb='_j'+Date.now()+'_'+Math.random().toString(36).slice(2,6),s=document.createElement('script');var d=false;var t=setTimeout(function(){if(!d){d=true;cl();rj(new Error('超时'))}},12000);window[cb]=function(v){if(!d){d=true;cl();rs(v)}};function cl(){clearTimeout(t);delete window[cb];if(s.parentNode)s.remove()}var q=new URLSearchParams(params);q.set('callback',cb);s.src=H+path+'?'+q;s.onerror=function(){if(!d){d=true;cl();rj(new Error('网络不通'))}};document.head.appendChild(s)})}
function hver(lat1,ln1,lat2,ln2){var R=6371000;var r=function(d){return d*Math.PI/180};var dl=r(lat2-lat1),dg=r(ln2-ln1);var a=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(dg/2)*Math.sin(dg/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function fmd(m){return m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km'}
function sts(r){var f=Math.floor(r);return'★'.repeat(f)+'☆'.repeat(5-f)}

function parsePoi(p,defLat,defLng){
  var loc=p.location||'0,0',parts=loc.split(',');var plng=parseFloat(parts[0])||0,plat=parseFloat(parts[1])||0;
  return{id:p.id||'p'+Math.random().toString(36).slice(2,8),name:p.name||'',type:p.type||'',_raw:p,lat:plat||defLat,lng:plng||defLng,dist:parseFloat(p.distance)||0,photos:p.photos||[],cost:parseFloat((p.biz_ext&&p.biz_ext.cost)||0),rating:parseFloat((p.biz_ext&&p.biz_ext.rating)||4.0),address:p.address||''};
}

/* 自动分页：每页25条，直到取完（最多8页=200家） */
async function fetchAll(lat,lng,radius){
  var all=[],seen={},page=1,maxPage=20;
  while(page<=maxPage){
    var d=await jp('/v3/place/around',{key:K,location:lng+','+lat,radius:String(radius),types:'050000',offset:'25',page:String(page),extensions:'all'});
    if(d.status!=='1')throw new Error(d.info||'API异常');
    var pois=d.pois||[],added=0;
    for(var i=0;i<pois.length;i++){
      var poi=parsePoi(pois[i],lat,lng);
      if(!seen[poi.id]){seen[poi.id]=true;all.push(poi);added++}
    }
    console.log('📄 p'+page+': '+added+'条, 累计'+all.length);
    if(pois.length<25)break; // 最后一页不足25条才停止
    page++;if(page<=maxPage)await new Promise(function(r){setTimeout(r,200)});
  }
  return all;
}

async function rgeo(lat,lng){
  var d=await jp('/v3/geocode/regeo',{key:K,location:lng+','+lat,extensions:'base'});if(d.status!=='1')return null;
  var comp=d.regeocode&&d.regeocode.addressComponent;if(!comp)return null;
  return(comp.streetNumber&&comp.streetNumber.street)||comp.township||comp.district||comp.city||null;
}
async function searchTips(kw,city){
  var p={key:K,keywords:kw};if(city&&city.length>0)p.city=city;
  console.log('🔎 搜索地址: kw='+kw+' city='+(city||'(全国)'));
  var d=await jp('/v3/assistant/inputtips',p);if(d.status!=='1'){console.warn('inputtips API返回:',d);return[]}
  var tips=d.tips||[];console.log('  收到'+tips.length+'条建议');
  return tips.map(function(t){
    var loc=String(t.location||'');if(loc==='[]'||loc==='')loc='';
    var parts=loc.split(',');var lng=parseFloat(parts[0])||0,lat=parseFloat(parts[1])||0;
    return{id:t.id,name:t.name,district:t.district||'',address:t.address||'',lng:lng,lat:lat,hasLoc:!!(loc&&loc!=='[]')};
  });
}

function buildPool(){var f=getFiltered();var a=f.filter(function(r){return!S.shownIds.has(r.id)});if(!a.length){S.shownIds.clear();a=f.slice();showToast('🔄 已全部展示过一轮，重新开始',2500)}if(!a.length)return{pool:[],err:'没有可选的餐厅'};if(a.length===1&&a[0].id===S.lastId)return{pool:[],err:'只有一家可选，无法更换'};var p;if(a.length<=6)p=a.slice();else{var arr=a.slice();for(var i=0;i<6;i++){var j=i+Math.floor(Math.random()*(arr.length-i)),tmp=arr[i];arr[i]=arr[j];arr[j]=tmp}p=arr.slice(0,6)}return{pool:p,err:null}}
function resetReels(){for(var n=1;n<=3;n++){document.getElementById('reelE'+n).textContent='🎰';document.getElementById('reelN'+n).textContent='准备'}document.querySelectorAll('.slot-reel').forEach(function(r){r.classList.remove('win')})}
function runSlot(pool,winner,cb){var cfgs=[{id:1,dur:1800},{id:2,dur:2500},{id:3,dur:3200}],st=performance.now(),lt=[0,0,0];cfgs.forEach(function(c,i){var ee=document.getElementById('reelE'+c.id),ne=document.getElementById('reelN'+c.id),re=document.getElementById('slotR'+c.id);var ci=Math.floor(Math.random()*pool.length);function tick(now){var e=now-st,p=Math.min(e/c.dur,1);if(p>=1){ee.textContent=winner.emoji;ne.textContent=winner.name.slice(0,5);re.classList.add('win');if(i===cfgs.length-1)setTimeout(function(){cb(winner)},700);return}var iv=50+p*p*400;if(now-lt[i]>=iv){ci=(ci+1)%pool.length;var it=pool[ci];ee.textContent=it.emoji;ne.textContent=it.name.slice(0,5);lt[i]=now}requestAnimationFrame(tick)}requestAnimationFrame(tick)})}
function openSlot(){var res=buildPool();if(res.err){showToast(res.err,2500);return}var ov=document.getElementById('slotOv');ov.classList.add('on');document.getElementById('slotHint').textContent='🎰 随机抽取中...';document.getElementById('slotClose').style.display='none';S.spinning=true;document.getElementById('btnRand').disabled=true;resetReels();var wi=Math.floor(Math.random()*res.pool.length),w=res.pool[wi];runSlot(res.pool,w,function(r){S.spinning=false;S.lastId=r.id;S.shownIds.add(r.id);document.getElementById('slotHint').textContent='🎉 '+r.name+'！';document.getElementById('slotClose').style.display='';setTimeout(function(){ov.classList.remove('on');document.getElementById('btnRand').disabled=false;showSheet(r)},1000)})}
function closeSlot(){if(S.spinning)return;document.getElementById('slotOv').classList.remove('on');document.getElementById('btnRand').disabled=false}

var srchTmr=null;
function openSrch(){document.getElementById('srchPage').classList.add('on');document.getElementById('srchBody').innerHTML='<div class="srch-empty">输入关键词搜索地址</div>';var i=document.getElementById('srchInp');i.value='';document.getElementById('srchClr').classList.remove('on');setTimeout(function(){i.focus()},300)}
function closeSrch(){document.getElementById('srchPage').classList.remove('on');document.getElementById('srchInp').blur()}
function onSrchInput(kw){var cl=document.getElementById('srchClr');if(kw.length){cl.classList.add('on')}else{cl.classList.remove('on');document.getElementById('srchBody').innerHTML='<div class="srch-empty">输入关键词搜索地址</div>';return}clearTimeout(srchTmr);srchTmr=setTimeout(function(){doSrch(kw)},300)}
async function doSrch(kw){var el=document.getElementById('srchBody');el.innerHTML='<div class="srch-loading">搜索中...</div>';try{var tips=await searchTips(kw,S.city||'');if(!tips.length){el.innerHTML='<div class="srch-empty">未找到相关地址</div>';return}var lat=S.loc.lat,lng=S.loc.lng;tips.forEach(function(t){t._d=t.hasLoc?hver(lat,lng,t.lat,t.lng):Infinity});tips.sort(function(a,b){return a._d-b._d});el.innerHTML=tips.map(function(t){var j=JSON.stringify({id:t.id,name:t.name,addr:t.district||t.address||'',lat:t.lat,lng:t.lng,hasLoc:t.hasLoc}).replace(/'/g,'&#39;');return'<div class="srch-item" data-t=\''+j+'\'><div class="srch-item-icon">📍</div><div class="srch-item-info"><div class="srch-item-name">'+escH(t.name)+'</div><div class="srch-item-addr">'+escH(t.address||t.district||'')+'</div></div><div class="srch-item-dist">'+(t.hasLoc?fmd(t._d):'')+'</div></div>'}).join('')}catch(e){el.innerHTML='<div class="srch-empty">搜索失败，请重试</div>';console.error(e)}}
async function selAddr(td){closeSrch();
  if(!td.hasLoc||!td.lat||!td.lng){
    // 无坐标 → 尝试用 name+addr 做正向地理编码
    var geoName=td.name+(td.addr?','+td.addr:'');
    try{var gd=await jp('/v3/geocode/geo',{key:K,address:geoName,city:S.city||''});if(gd.status==='1'&&gd.geocodes&&gd.geocodes.length){var gc=gd.geocodes[0];var parts=gc.location.split(',');td.lat=parseFloat(parts[1])||0;td.lng=parseFloat(parts[0])||0;td.hasLoc=true}}
    catch(e){console.warn('地理编码失败:',e)}
    if(!td.hasLoc||!td.lat||!td.lng){showToast('无法获取该地址坐标，请尝试更具体的关键词');return}
  }
  S.loc={lat:td.lat,lng:td.lng};S.locStat='ok';S.locLabel=td.name;updLocUI();await loadData();showToast('已定位到 '+(td.name||'选中地址')+' 📍')}
function switchTab(n){if(S.tab===n)return;S.tab=n;document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.getElementById('page-'+n).classList.add('active');document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active')});document.querySelector('.nav-tab[data-tab="'+n+'"]').classList.add('active');document.getElementById('btnRand').classList.toggle('hide',n!=='home')}

/* ═══ Init ═══ */
function init(){
  ldBl();S.loading=true;S.locStat='error';S.locLabel='定位失败，点击选择';updLocUI();renderHome();setTimeout(reqLoc,100);
  // 顶部
  document.getElementById('topLoc').addEventListener('click',function(){if(S.locStat!=='loading')openSrch()});
  document.getElementById('topDist').addEventListener('click',function(){toggleDistPop()});
  document.getElementById('distBack').addEventListener('click',function(){closeDistPop()});
  // 分类Tab
  document.getElementById('catTabs').addEventListener('click',function(e){var t=e.target.closest('.cat-tab');if(t)selectCat1(t.dataset.v)});
  document.getElementById('subRow').addEventListener('click',function(e){var c=e.target.closest('.sub-chip');if(c)selectCat2(c.dataset.v)});
  // 列表
  document.getElementById('resList').addEventListener('click',function(e){var mo=e.target.closest('[data-act="more"]');if(mo){e.stopPropagation();var r=mo.getBoundingClientRect();showPop(mo.dataset.id,r.left+r.width/2,r.bottom);return}var cd=e.target.closest('.res-card');if(cd){ripple(e,cd);var r=getFiltered().find(function(x){return x.id===cd.dataset.id});if(r)showSheet(r)}});
  document.getElementById('popMenu').addEventListener('click',function(e){if(e.target.closest('[data-act="bl-pop"]')){var id=S.popId,r=S.all.find(function(x){return x.id===id});if(id){addBl(id);if(S.lastId===id)S.lastId=null;renderHome();showToast('已拉黑 '+(r?r.name:'')+' 🚫')}hidePop()}});
  document.addEventListener('click',function(e){if(S.popId&&!e.target.closest('.pop-menu')&&!e.target.closest('[data-act="more"]'))hidePop()});
  // 随机
  document.getElementById('btnRand').addEventListener('click',function(){if(S.spinning)return;if(!getFiltered().length){showToast('没有可选的餐厅 😢',2500);return}openSlot()});
  document.getElementById('slotClose').addEventListener('click',function(){closeSlot()});document.getElementById('slotOv').addEventListener('click',function(e){if(e.target===e.currentTarget)closeSlot()});
  // Sheet
  document.getElementById('sheetOv').addEventListener('click',function(){closeSheet()});document.getElementById('sheetClose').addEventListener('click',function(){closeSheet()});
  document.getElementById('sheetNav').addEventListener('click',function(){if(S.curSheet)navigate(S.curSheet)});
  document.getElementById('sheetReroll').addEventListener('click',function(){closeSheet();setTimeout(function(){if(!getFiltered().length){showToast('没有其他可选 😢',2500);return}openSlot()},400)});
  document.getElementById('sheetPn').addEventListener('click',function(e){e.stopPropagation()});
  // 黑名单
  document.getElementById('btnBl').addEventListener('click',function(){showBlModal()});document.getElementById('blClose').addEventListener('click',function(){closeBlModal()});document.getElementById('blOv').addEventListener('click',function(e){if(e.target===e.currentTarget)closeBlModal()});
  document.getElementById('blBody').addEventListener('click',function(e){var b=e.target.closest('[data-act="restore"]');if(!b)return;rmBl(b.dataset.id);var r=S.all.find(function(x){return x.id===b.dataset.id});renderHome();showBlModal();showToast('已恢复 '+(r?r.name:'')+' ✅')});
  // 搜索
  document.getElementById('srchBack').addEventListener('click',function(){closeSrch()});
  document.getElementById('srchInp').addEventListener('input',function(){onSrchInput(document.getElementById('srchInp').value.trim())});
  document.getElementById('srchClr').addEventListener('click',function(){document.getElementById('srchInp').value='';document.getElementById('srchClr').classList.remove('on');document.getElementById('srchBody').innerHTML='<div class="srch-empty">输入关键词搜索地址</div>';document.getElementById('srchInp').focus()});
  document.getElementById('srchBody').addEventListener('click',function(e){var it=e.target.closest('.srch-item');if(!it)return;try{selAddr(JSON.parse(it.dataset.t))}catch(er){console.error(er)}});
  // 底部导航
  document.querySelector('.bottom-nav').addEventListener('click',function(e){var t=e.target.closest('.nav-tab');if(t)switchTab(t.dataset.tab)});
  // Escape
  document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(document.getElementById('sheetOv').classList.contains('on'))closeSheet();else if(document.getElementById('slotOv').classList.contains('on'))closeSlot();else if(document.getElementById('blOv').classList.contains('on'))closeBlModal();else if(document.getElementById('srchPage').classList.contains('on'))closeSrch();else if(S.popId)hidePop();else if(document.getElementById('distPop').classList.contains('on'))closeDistPop()});
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
